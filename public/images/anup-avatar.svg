<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2aa87" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="4" />
  
  <!-- Ambient Orbit Rings -->
  <ellipse cx="200" cy="200" rx="160" ry="70" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" transform="rotate(-25 200 200)" />
  <ellipse cx="200" cy="200" rx="170" ry="80" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="10 8" opacity="0.4" transform="rotate(35 200 200)" />

  <!-- Developer Silhouette / Character -->
  <!-- Hoodie / Shoulders -->
  <path d="M 100 370 C 100 280, 140 270, 200 270 C 260 270, 300 280, 300 370 Z" fill="#0f172a" />
  <!-- Purple Inner Collar -->
  <path d="M 160 270 L 200 320 L 240 270 Z" fill="url(#accentGrad)" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="60" rx="10" fill="url(#skinGrad)" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="65" ry="75" fill="url(#skinGrad)" />

  <!-- Hair - Modern undercut / stylish dev hair -->
  <path d="M 130 170 C 130 110, 160 85, 200 85 C 240 85, 270 110, 270 170 C 265 140, 245 120, 200 120 C 155 120, 135 140, 130 170 Z" fill="#18181b" />
  <path d="M 140 120 C 170 80, 230 75, 265 110 C 250 95, 210 90, 175 105 Z" fill="#27272a" />

  <!-- Stylish Glasses (Signature Tech Educator look) -->
  <rect x="150" y="165" width="42" height="28" rx="8" fill="none" stroke="#7c3aed" stroke-width="4" />
  <rect x="208" y="165" width="42" height="28" rx="8" fill="none" stroke="#7c3aed" stroke-width="4" />
  <line x1="192" y1="178" x2="208" y2="178" stroke="#7c3aed" stroke-width="4" />
  <!-- Glasses lens reflection -->
  <line x1="156" y1="172" x2="172" y2="186" stroke="#ffffff" stroke-width="2" opacity="0.7" />
  <line x1="214" y1="172" x2="230" y2="186" stroke="#ffffff" stroke-width="2" opacity="0.7" />

  <!-- Friendly Smile -->
  <path d="M 185 215 Q 200 230 215 215" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Tech Badges -->
  <!-- Code Badge Left -->
  <g transform="translate(45, 140)">
    <circle cx="20" cy="20" r="24" fill="#0f172a" stroke="#61dafb" stroke-width="2.5" />
    <text x="20" y="26" font-family="monospace" font-size="14" font-weight="bold" fill="#61dafb" text-anchor="middle">&lt;JS&gt;</text>
  </g>
  <!-- Python Badge Right -->
  <g transform="translate(315, 140)">
    <circle cx="20" cy="20" r="24" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5" />
    <text x="20" y="26" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">PY</text>
  </g>
  <!-- React Badge Bottom Right -->
  <g transform="translate(290, 250)">
    <circle cx="20" cy="20" r="20" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    <text x="20" y="25" font-family="monospace" font-size="11" font-weight="bold" fill="#a78bfa" text-anchor="middle">React</text>
  </g>
  <!-- Next.js Badge Bottom Left -->
  <g transform="translate(65, 250)">
    <circle cx="20" cy="20" r="20" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="20" y="25" font-family="monospace" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">Next</text>
  </g>

  <!-- Glowing Accent Dots -->
  <circle cx="90" cy="90" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="310" cy="80" r="5" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="200" cy="40" r="3" fill="#a855f7" filter="url(#glow)" />
</svg>